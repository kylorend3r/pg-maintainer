name: Release
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  qualify:
    name: Qualify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}" >&2
            exit 1
          fi

      - name: Run unit tests
        run: cargo test --test unit_tests --verbose

      - name: Run CLI validation tests
        run: cargo test --test cli_validation --verbose

      - name: Run logging and dry-run tests
        run: cargo test --test logging_and_dry_run --verbose

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

  create-release:
    name: Create GitHub Release
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - name: Create release with auto-generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build:
    name: Build ${{ matrix.asset_name }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset_name: linux-musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset_name: linux-arm64-musl
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset_name: macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset_name: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: endsWith(matrix.target, '-unknown-linux-musl')
        run: sudo apt-get install -y musl-tools

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Archive binary
        run: |
          tar -czf pg-maintainer-${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz \
            -C target/${{ matrix.target }}/release pg-maintainer
          shasum -a 256 pg-maintainer-${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz \
            > pg-maintainer-${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz.sha256

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pg-maintainer-${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz
            pg-maintainer-${{ matrix.asset_name }}-${{ github.ref_name }}.tar.gz.sha256
